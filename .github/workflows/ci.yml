# vcp-hub CI — every PR must pass the publish lint.
#
# Enforced here:
#   1. Every artifact is signed by a key registered to ITS namespace in the
#      root-signed namespace_registry.json, hash-consistent, and schema-valid;
#      verified-tier artifacts carry a valid ref-bound root counter-signature
#      (vcp lint).
#   2. index.json content is exactly what `vcp build-index` regenerates (no
#      hand edits). On main, the index must additionally carry a valid ROOT
#      signature + monotonic sequence (the release ceremony); PRs cannot sign,
#      so they lint with --pr and a maintainer runs the ceremony on merge.
#   3. Published versions are immutable: a PR may add new version directories
#      but may not add, modify, delete or rename files under existing ones
#      (counter-signing ceremony fields excepted: trust_tier may only go up and
#      a countersig is never deleted; the one-time v1 -> v2 sidecar re-sign is
#      allowed when content_sha256, key_id and ref are unchanged), and the root-signed
#      namespace_registry.json / index.json sequences never go backwards
#      (.github/scripts/check_published_immutability.py).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vcp client
        run: pip install "vcp-sdk[hub] @ git+https://github.com/Creed-Space/vcp-sdk-python"

      - name: Lint registry tree (strict on main, --pr on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vcp lint --pr .
          else
            vcp lint .
          fi

      - name: index.json is generated, not hand-edited
        run: |
          cp index.json /tmp/index.committed.json
          vcp build-index .
          diff -u /tmp/index.committed.json index.json

      - name: Published versions are immutable; trust documents never roll back
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Every path under an existing version directory is frozen (adds,
          # edits, deletes, renames). Only the counter-signing ceremony may
          # touch it: entry.json's trust_tier / distribution.counter_signatures
          # and the <artifact>.ed25519.countersig sidecar, and only upward: the
          # tier never drops and a countersig is never deleted. The one exception
          # outside the ceremony is the v1 -> v2 sidecar re-sign with the same
          # content_sha256, key_id and ref. namespace_registry.json and
          # index.json may not go back to a lower sequence.
          python3 .github/scripts/check_published_immutability.py --base "$BASE"

      - name: Trust documents never roll back (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_published_immutability.py --base "$BASE" --sequences-only

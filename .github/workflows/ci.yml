# vcp-hub CI — every PR must pass the publish lint.
#
# Enforced here:
#   1. Every artifact is signed by a key registered to ITS namespace in the
#      root-signed namespace_registry.json, hash-consistent, and schema-valid;
#      verified-tier artifacts carry a valid ref-bound root counter-signature
#      (vcp lint).
#   2. index.json content is exactly what `vcp build-index` regenerates (no
#      hand edits). On main, the index must additionally carry a valid ROOT
#      signature + monotonic sequence (the release ceremony); PRs cannot sign,
#      so they lint with --pr and a maintainer runs the ceremony on merge.
#   3. Published versions are immutable: a PR may add new version directories
#      but may not modify or delete files under existing ones.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vcp client
        run: pip install "vcp-sdk[hub] @ git+https://github.com/Creed-Space/vcp-sdk-python"

      - name: Lint registry tree (strict on main, --pr on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vcp lint --pr .
          else
            vcp lint .
          fi

      - name: index.json is generated, not hand-edited
        run: |
          cp index.json /tmp/index.committed.json
          vcp build-index .
          diff -u /tmp/index.committed.json index.json

      - name: Published versions are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Files changed (not added) under namespaces/ = mutation of a published
          # version. Exception: entry.json may change during the verified-tier
          # counter-signing ceremony (GOVERNANCE.md) — its load-bearing fields
          # (id/version/namespace/content_sha256/tier-vs-countersig agreement)
          # are all re-pinned by `vcp lint` above, so drift there still fails CI.
          # Artifact bytes and publisher signatures are immutable, no exceptions.
          MUTATED=$(git diff --diff-filter=MD --name-only "$BASE"...HEAD -- namespaces/ | grep -v '/entry.json$' || true)
          if [ -n "$MUTATED" ]; then
            echo "::error::published versions are immutable; bump the version instead of modifying:"
            echo "$MUTATED"
            exit 1
          fi
